services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inventory-net

  # Local storage emulator required by the Functions host for the Timer trigger's
  # internal state. Not needed once deployed to real Azure/hosting.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: inventory-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - inventory-net

  functions:
    build:
      context: .
    container_name: inventory-functions
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      SendGrid__ApiKey: ${SENDGRID_API_KEY}
      Alert__FromEmail: ${ALERT_EMAIL_FROM}
      Alert__ToEmail: ${ALERT_EMAIL_TO}
    ports:
      - "7071:80"
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  postgres-data:
